services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/claims.json:/app/frontend/claims.json
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./frontend/claims.json:/app/frontend/claims.json
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
